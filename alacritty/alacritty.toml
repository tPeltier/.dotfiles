[font]
normal = { family = "JetBrainsMono Nerd Font" }
size = 11

[cursor]
style = { shape = "Block" }
unfocused_hollow = true

[window]
opacity = 1.0

[colors.primary]
foreground = "#e2e2e3"
background = "#181819"

[colors.cursor]
text = "#181819"
cursor = "#fc5d7c"

[colors.normal]
black   = "#000000"
red     = "#fc5d7c"
green   = "#9ed072"
yellow  = "#e7c664"
blue    = "#76cce0"
magenta = "#b39df3"
cyan    = "#14ffff"
white   = "#ffffff"

[colors.bright]
black   = "#000000"
red     = "#fc5d7c"
green   = "#9ed072"
yellow  = "#e7c664"
blue    = "#76cce0"
magenta = "#b39df3"
cyan    = "#14ffff"
white   = "#ffffff"
