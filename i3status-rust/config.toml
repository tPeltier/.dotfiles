[icons]
icons = "none"

[theme]
theme = "native"

# Needs a notification daemon running
[[block]]
block = "notify"
driver = "dunst"
format = " $icon {($notification_count.eng(w:1)) |}"

[[block]]
block = "music"
format = " $icon {$combo.str(max_w:25) $play $prev $next |}"

[[block]]
block = "load"
format = " $icon $1m "

[[block]]
block = "memory"
format = " $icon $mem_used_percents "

[[block]]
block = "pomodoro"
notify_cmd = "swaynag -m '{msg}'"
blocking_cmd = true

[[block]]
block = "tea_timer"
format = " $icon {$time.duration(hms:true) |}"
done_cmd = "swaynag -m 'Timer done'"

[[block]]
block = "privacy"
[[block.driver]]
name = "pipewire"

# # Requires rofi + rofication-daemon running
# [[block]]
# block = "rofication"
# format = " $icon $num.eng(w:1) "

[[block]]
block = "sound"
driver = "auto"
format = " $icon {$volume.eng(w:2) |}"

[[block]]
block = "hueshift"
hue_shifter = "wl-gammarelay-rs"
format = " $icon $temperature "

[[block]]
block = "net"
device = "^wl"
missing_format = ""
# format = " $icon $ssid ($signal_strength%) $ip "
format = " $icon ($signal_strength%) $ip "

[[block]]
block = "net"
device = "^en"
missing_format = ""
# format = " $icon $ip ($speed_down.eng(prefix:K)) "
format = " $icon ($speed_down.eng(prefix:K)) "

[[block]]
block = "battery"
format = " $icon $percentage {$time_remaining |}"

[[block]]
block = "time"
format = " $timestamp.datetime(f:'%Y-%m-%d %H:%M:%S') "

